
  # openrouter (default) 
  provider: "openrouter"

  # Reasoning model — for complex tasks: hypothesis generation, data analysis, grounding
  model: "deepseek/deepseek-v4-flash:free"

  # Chat model — for short-form tasks: one-line rewrites, rationale summaries
  chat_model: "deepseek/deepseek-v4-flash:free"

  # Tried in order when the primary model returns an error or times out
  fallback_models:
    - "meta-llama/llama-3.3-70b-instruct:free"
    - "nousresearch/hermes-3-llama-3.1-405b:free"
    - "openai/gpt-oss-120b:free"
    - "nvidia/nemotron-3-super-120b-a12b:free"
    - "qwen/qwen3-next-80b-a3b-instruct:free"
    - "google/gemma-4-31b-it:free"
    - "minimax/minimax-m2.5:free"
    - "qwen/qwen3-coder:free"
    - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
    - "nvidia/nemotron-3-nano-30b-a3b:free"
    - "google/gemma-4-26b-a4b-it:free"
    - "z-ai/glm-4.5-air:free"
    - "openai/gpt-oss-20b:free"
    - "inclusionai/ring-2.6-1t:free"
    - "arcee-ai/trinity-large-thinking:free"
    - "baidu/cobuddy:free"

  # Vision-language models — for figure description (XRD, SEM, J-V curves, etc.)
  vlm_model: "google/gemma-4-31b-it:free"

  vlm_fallback_models:
    - "google/gemma-4-26b-a4b-it:free"
    - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
    - "nvidia/nemotron-nano-12b-v2-vl:free"